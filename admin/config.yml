backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "pricing"
    label: "Prijzen (Pricing)"
    folder: "data/pricing"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: "json"
    fields:
      - {label: "Titel", name: "title", widget: "string"}
      - {label: "Duur (minuten)", name: "duration", widget: "number"}
      - {label: "Originele Prijs (€)", name: "original_price", widget: "number", required: false}
      - {label: "Huidige Prijs (€)", name: "current_price", widget: "number"}
      
  - name: "campaigns"
    label: "Campagnes (Campaigns)"
    folder: "data/campaigns"
    create: true
    format: "json"
    fields:
      - {label: "Titel", name: "title", widget: "string"}
      - {label: "Beschrijving", name: "description", widget: "text"}
      - {label: "Kortingscode", name: "code", widget: "string", required: false}
      
  - name: "testimonials"
    label: "Recensies (Testimonials)"
    folder: "data/testimonials"
    create: true
    format: "json"
    fields:
      - {label: "Naam", name: "name", widget: "string"}
      - {label: "Beoordeling (Sterren)", name: "rating", widget: "number", default: 5, min: 1, max: 5}
      - {label: "Bericht", name: "message", widget: "text"}
